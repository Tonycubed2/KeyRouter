; Key Router 1.5.1
; When two or more mods want the same key press, a window asks which one gets it.
; Tick "Remember my choice" in that window to stop being asked for that key (answers are kept in
; KeyRouter_Choices.ini).
; With SKSE Menu Framework installed, every option below can also be changed in game: open its
; menu (F1 by default) and go to Key Router > Settings. Changes made there are written back to
; this file.

[General]
; 1 = on, 0 = no key routing (the kill switch below still works)
Enabled=1

; Count Skyrim's own controls (Activate, Sprint, Ready Weapon...) as one of the competitors
IncludeGameControls=1

; Also check mouse buttons
IncludeMouseButtons=0

; 0 = only check during normal play (no menu or console open)
; 1 = also check while menus are open (Skyrim's own controls are never counted in menus)
CheckInMenus=0

; Read the .ini/.toml/.json files of SKSE DLL mods to learn their hotkeys
ScanDllConfigs=1

; DLL mods that read the keyboard themselves (GetAsyncKeyState/GetKeyState/GetKeyboardState)
PollHooks=1

; DLL mods that read the keyboard through their own DirectInput device
DirectInputHooks=1

; When you have already let go of the key by the time you pick, the picked mod gets a tap this
; long (milliseconds, 30 to 2000). Keep it short: many mods treat a key held 0.15 s or longer as
; "hold" instead of "tap" (Dragon's Eye Minimap: tap L hides the map, hold L controls it).
; To give a mod a hold, keep holding the key while you click your choice.
SyntheticPressMs=50

; 1 = write one line per key press to KeyRouter.log: which mods wanted it and what Key Router
; did with it. For finding out why a key does or does not ask. Set back to 0 for normal play.
LogKeys=0

; 1 = write [diag] lines to KeyRouter.log: once a second how often Key Router's input hook ran,
; and for every press Key Router replays, the game state and every game input handler.
; For finding faults only; set back to 0 for normal play.
Diagnostics=0

[KillSwitch]
; Hold this key for HoldSeconds while Skyrim is the active window and Skyrim is ended at once.
; Works even when the game is frozen. One beep 3 seconds before the end, a low beep when it
; happens. For remote play (Moonlight/Sunshine) where Task Manager is out of reach.
; Nothing is saved: you lose anything since your last save.
Enabled=1
; A key name (K, F10, End, Num 0...) or a DirectX scan code
Key=K
; 3 to 60
HoldSeconds=10

[KeyboardMap]
; Hold this key for HoldSeconds and a map of the keyboard and mouse opens, the game paused.
; green = no mod, orange = one mod, yellow = shared but no conflict (passive mods),
; red = conflict. A blue corner means a remembered choice. Mouse wheel zooms, left-drag
; moves the map; zoom in to see mod names on the keys; hover a key for the full list.
; Esc or the Close button closes it. Needs SKSE Menu Framework.
Enabled=1
; A key name or a DirectX scan code
Key=Backspace
; 1 to 60
HoldSeconds=10
; Keyboard drawn on the map: US (ANSI, 104 keys) or UK (ISO, 105 keys: tall Enter, # key, the
; extra \ key next to Left Shift, UK labels). Also switchable with the Layout button on the map.
Layout=US

[PassiveMods]
; Mods listed here still get every key, but never count as a competitor. Use this only for a
; mod that just watches a key without doing anything of its own with it.
; Plugin or DLL file name = 1, one per line. Use Skyrim = 1 for the game's own controls.
;SomeMod.esp = 1
;SomeHelper.dll = 1
; TK Dodge reads the movement, sprint, attack and block keys only to aim the dodge (Q)
TKDodge.esp = 1

[DllKeys]
; Corrects or adds the hotkeys of an SKSE DLL mod when its config file could not be read or was
; read wrong (the log lists every DLL hotkey Key Router found).
; DLL name (without .dll) = keys, comma separated. A key is a DirectX scan code (decimal or 0x hex)
; or a name like G, F5, Left Shift, Num 7. A combo uses +, for example Left Shift+G.
; Left and Right Alt/Ctrl/Shift are separate keys: Left Alt+F5 needs Left Alt, Right Alt+F5 needs
; Right Alt, Left Alt+Right Alt+F5 needs both. Plain Alt, Ctrl or Shift means either side.
; Write none to tell Key Router that DLL has no hotkeys.
;SomeDll = 0x22, Left Ctrl+F5
;OtherDll = none
