name: Upload to Nexus Mods

# Manual release: Actions tab -> "Upload to Nexus Mods" -> Run workflow.
# Nothing is built here. The zip is the one Tony built on his PC and attached to the GitHub
# release for the tag below (KeyRouter-<version>.zip). This workflow downloads that asset, checks
# it holds the DLL and the INI, and uploads it to Nexus as a new version of the main file, with
# the changelog.
#
# Needs, in the "nexus" environment (Settings -> Environments -> nexus):
#   secret   NEXUSMODS_API_KEY  - personal API key from nexusmods.com/settings/api-keys
#   variable NEXUSMODS_FILE_ID  - optional; "File ID" of the main file (Files tab -> Advanced -> API), default 8301024
#   variable NEXUSMODS_MOD_ID   - optional; "Unique Mod ID" (same dialog), default 7318624470225

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub release tag whose zip to upload (e.g. v1.4.0)"
        required: true
      version:
        description: "Version shown on Nexus (e.g. 1.4.0)"
        required: true
      changelog:
        description: "Changelog text (optional, plain text; use ' | ' to separate lines)"
        required: false
        default: ""
      display_name:
        description: "File name shown on Nexus"
        required: false
        default: "Key Router"

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: nexus
    steps:
      - name: Check settings
        env:
          HAS_KEY: ${{ secrets.NEXUSMODS_API_KEY != '' }}
          FILE_ID: ${{ vars.NEXUSMODS_FILE_ID || '8301024' }}
          MOD_ID: ${{ vars.NEXUSMODS_MOD_ID || '7318624470225' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then echo "::error::Secret NEXUSMODS_API_KEY is missing in the nexus environment"; exit 1; fi
          if [ -z "$FILE_ID" ]; then echo "::error::Variable NEXUSMODS_FILE_ID is missing in the nexus environment"; exit 1; fi
          if [ -z "$MOD_ID" ]; then echo "::error::Variable NEXUSMODS_MOD_ID is missing in the nexus environment"; exit 1; fi

      - name: Download the zip from the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'KeyRouter-*.zip' --dir dl
          count=$(ls dl/*.zip | wc -l)
          if [ "$count" != "1" ]; then echo "::error::Release $TAG must have exactly one KeyRouter-*.zip asset (found $count)"; exit 1; fi
          mv dl/*.zip KeyRouter.zip

      - name: Make sure the zip is complete
        run: |
          unzip -l KeyRouter.zip
          for f in SKSE/Plugins/KeyRouter.dll SKSE/Plugins/KeyRouter.ini SKSE/Plugins/KeyRouter_GPL-3.0.txt; do
            if ! unzip -l KeyRouter.zip "$f" > /dev/null; then echo "::error::MISSING $f in the zip - not uploading"; exit 1; fi
          done

      - name: Format changelog
        id: log
        if: ${{ inputs.changelog != '' }}
        env:
          TEXT: ${{ inputs.changelog }}
        run: |
          {
            echo "text<<CHANGELOG_EOF"
            printf '%s\n' "$TEXT" | sed 's/ | /\n/g'
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID || '8301024' }}
          filename: KeyRouter.zip
          display_name: ${{ inputs.display_name }}
          version: ${{ inputs.version }}
          mod_id: ${{ vars.NEXUSMODS_MOD_ID || '7318624470225' }}
          changelog: ${{ steps.log.outputs.text }}
          update_mod_version: true
